apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
spec:

  selector:
    matchLabels:
      app: employee-service

  template:
    metadata:
      labels:
        app: employee-service

    spec:
      containers:
        - name: employee-service

          image: 488179516441.dkr.ecr.us-east-1.amazonaws.com/python-microservice:employee-service-7
          imagePullPolicy: Always

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 5001

          envFrom:
            - configMapRef:
                name: employee-service-config

            - secretRef:
                name: employee-db-secret
