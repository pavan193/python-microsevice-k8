apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment

spec:

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 488179516441.dkr.ecr.us-east-1.amazonaws.com/python-microservice:frontend-12
          imagePullPolicy: Always

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: frontend-config
