apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-practice-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: subnet-096aa094d0b082133,subnet-07df2d66313b88d78,subnet-0bacc2639cc9de51f
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
