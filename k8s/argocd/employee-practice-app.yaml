apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-practice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pavan193/python-microsevice-k8.git
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
