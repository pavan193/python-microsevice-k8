apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: employee-db
spec:
  serviceName: employee-db

  replicas: 1

  selector:
    matchLabels:
      app: employee-db

  template:
    metadata:
      labels:
        app: employee-db

    spec:
      containers:
        - name: postgres

          image: postgres:17

          ports:
            - containerPort: 5432

          envFrom:
            - configMapRef:
                name: employee-db-config

            - secretRef:
                name: employee-db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: gp2

        resources:
          requests:
            storage: 10Gi